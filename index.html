<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【載入中...】</title>
  <style>
    /* 將整個畫面置中，並使用黑色背景 */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000; /* 修改為黑色背景 */
      font-family: Arial, sans-serif;
    }

    /* 容器包含圖片與進度條 */
    .loader-container {
      text-align: center;
    }

    /* 圖片樣式設定，圖片置中顯示 */
    .loader-image {
      max-width: 300px;
      height: auto;
      margin-bottom: 20px;
    }

    /* 進度條外框設定，搭配黑底使用深灰色 */
    .progress-bar {
      width: 300px;
      height: 10px;
      background-color: #444; /* 深色背景以配合黑底 */
      border-radius: 10px;
      overflow: hidden;
    }

    /* 進度條內部顯示動畫的區塊 */
    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: #ffffff; /* 白色進度條 */
      transition: width 0.3s; /* 平滑動畫 */
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <!-- 圖片顯示區，請將 src 替換成你要的圖片路徑 -->
    <img class="loader-image" src="Image/MHLogo.png" alt="載入中圖片">

    <!-- 進度條區塊 -->
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <script>
    // 模擬讀取進度，從 0% 增加到 100%
    let progress = 0;
    const fill = document.getElementById('progressFill');

    const interval = setInterval(() => {
      if (progress >= 100) {
        clearInterval(interval); // 當讀取完成時停止計時器
        // 讀取完成後跳轉至目標頁面，請將網址替換為你自己的頁面
        window.location.href = "index1.html"; // TODO: 將 Index.html 改成你的目標頁面
      } else {
        progress += 1; // 每次增加 1%
        fill.style.width = progress + '%'; // 更新進度條寬度
      }
    }, 30); // 每 30 毫秒更新一次進度
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midnight Homies Club</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #272727;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }

    /* 背景圖片樣式 */
    .background-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('./Image/MHLogoB.png') no-repeat center center/cover;
      z-index: -1;
    }

    /* 上方導覽列 */
    .navbar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: rgb(0, 0, 0);
      border-bottom: 1px solid #333;
    }

    .navbar a img {
      height: 40px;
    }

    .nav-buttons button {
      background: none;
      border: 1px solid #666;
      color: white;
      padding: 8px 16px;
      margin-left: 10px;
      border-radius: 5px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      z-index: 1;
      transition: color 0.3s ease;
    }

    .nav-buttons button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0.2), rgba(255,255,255,0));
      z-index: -1;
      transition: left 0.5s;
    }

    .nav-buttons button:hover::before {
      left: 100%;
    }

    .nav-buttons button:hover {
      color: #ff0000;
    }

    /* 幻燈片區塊 */
    .slideshow-container {
      position: relative;
      max-width: 90%;
      margin: 100px auto 0;
      overflow: hidden;
      z-index: 5;
    }

    .slide {
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      position: absolute;
      width: 100%;
    }

    .slide.active {
      opacity: 1;
      position: relative;
    }

    .slide img {
      width: 40%;
      border-radius: 10px;
    }

    .slide .text {
      width: 55%;
      padding: 20px;
      font-size: 18px;
      line-height: 1.6;
      background-color: rgba(0,0,0,0.6);
      border-left: 4px solid #ff0000;
      border-radius: 8px;
    }

    /* 音量控制區塊 */
    .audio-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      background: #222;
      border: 1px solid #ffffff;
      border-radius: 30px;
      padding: 3px 6px;
      z-index: 10;
    }

    .audio-control button {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      margin-right: 10px;
      transition: transform 0.3s;
    }

    .audio-control button:hover {
      transform: scale(1.2);
      color: #ffffff;
    }

    .audio-control input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 5px;
      background: #444;
      outline: none;
      border-radius: 5px;
      overflow: hidden;
    }

    .audio-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: #ff0000;
      cursor: pointer;
      border-radius: 50%;
    }

    .audio-control input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: #ff0000;
      cursor: pointer;
      border-radius: 50%;
    }

    /* 版權資訊 */
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding: 3px;
      font-size: 10px;
      color: #aaa;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="background-image"></div>

  <div class="navbar">
    <a href="Index_loading.html">
      <img src="Image/MHLogo.png" alt="Logo">
    </a>
    <div class="nav-buttons">
      <button onclick="location.href='page1.html'">尚未開放</button>
      <button onclick="location.href='Location.html'">各區據點</button>
      <button onclick="location.href='Gathering.html'">車聚活動</button>
      <button onclick="location.href='CooperativeStores.html'">特約商店</button>
      <button onclick="location.href='Links.html'">各式連結</button>
      <button onclick="location.href='Contact.html'">聯絡我們</button>
      <button onclick="location.href='About.html'">關於我們</button>
    </div>
  </div>

  <!-- Our News 區塊 -->
  <div class="slideshow-container">
    <div class="slide active">
      <img src="Image/IndexImage/news1.png" alt="News Image 1">
      <div class="text">
        <h1>Our News</h1>
        <h2>SGT IV 隨意亂剪</h2>
        <p>test123</p>
      </div>
    </div>
    <div class="slide">
      <img src="Image/IndexImage/news1.png" alt="News Image 2">
      <div class="text">
        <h1>New Car Gathering</h1>
        <h2>車聚最新消息</h2>
        <p>努力籌備中!</p>
      </div>
    </div>
  </div>
  <!-- 介紹區塊 -->
   <div> 
        <h1 style="text-align: center; margin-top: 20px;">Midnight Homies Club</h1>
        <p style="text-align: center; font-size: 18px;">Since 2024 HsinChu Country</p>
   </div>

  <div class="audio-control">
    <button id="muteBtn" title="切換音量">🔊</button>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
  </div>

  <footer>
    Copyright © 2025 Midnight Homies Club. All rights reserved.
  </footer>

  <script>
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    let bgAudio = new Audio('Audio/IndexMusic.mp3');
    bgAudio.loop = true;
    bgAudio.volume = 0.5;

    let isMuted = false;

    const startAudio = () => {
      bgAudio.play().catch(err => console.log("音樂播放錯誤:", err));
      document.removeEventListener('click', startAudio);
    };

    document.addEventListener('click', startAudio);

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      bgAudio.muted = isMuted;
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    volumeSlider.addEventListener('input', () => {
      bgAudio.volume = volumeSlider.value;
    });

    // 幻燈片輪播
    let slideIndex = 0;
    const slides = document.querySelectorAll('.slide');
    setInterval(() => {
      slides[slideIndex].classList.remove('active');
      slideIndex = (slideIndex + 1) % slides.length;
      slides[slideIndex].classList.add('active');
    }, 5000);
  </script>
</body>
</html>
